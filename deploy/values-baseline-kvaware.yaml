# Baseline deployment: 2 vLLM replicas (1 per A10 GPU) + kvaware router.
# Cluster: gapu-2 (OpenShift), 2x NVIDIA A10 23GB.
# Derived from production-stack tutorials/assets/values-17-kv-aware.yaml.
#
# NOTE: model + hf_token secret are set at install time; see "Step 1: install the
# stack" in benchmarks/README.md.

servingEngineSpec:
  runtimeClassName: ""
  # Both GPUs are always fully occupied -> RollingUpdate deadlocks (new pods
  # Pending on GPU, old pods not killed until new ready). Recreate avoids it.
  strategy:
    type: Recreate
  modelSpec:
    - name: "llm"
      repository: "lmcache/vllm-openai"
      # IMPORTANT: engine lmcache version must stay protocol-compatible with the
      # router image's lmcache (controller<->worker ZMQ schema skew breaks
      # registration SILENTLY). lmstack-router:latest carries lmcache 0.3.11;
      # v0.5.1rc2 (lmcache 0.5.1rc2) is too far ahead - v0.3.9post2 is the
      # closest official engine release to the router's 0.3.11.
      tag: "v0.3.9post2"
      modelURL: "Qwen/Qwen2.5-3B-Instruct"  # ungated - no HF token needed
      replicaCount: 2               # one per GPU node
      # GPU workers are heavily over-requested by idle platform pods (worker0: only ~5Gi
      # requestable) but actual free RAM is ~22Gi+. Small requests for schedulability,
      # NO memory limit so the pod can burst. Keep both replicas identical.
      requestCPU: 6
      requestMemory: "4Gi"
      requestGPU: 1
      shmSize: "4Gi"
      pvcStorage: "50Gi"
      # 2 replicas on different nodes share the model PVC -> must be RWX (CephFS).
      # Default ceph-rbd is RWO and would strand the second replica in Pending.
      storageClass: "ocs-external-storagecluster-cephfs"
      pvcAccessMode:
        - ReadWriteMany

      vllmConfig:
        enablePrefixCaching: true
        maxModelLen: 16384
        # Amended methodology (#3). At 0.90 the whole prefix pool fits on EVERY
        # engine, so there is no placement decision for cache-aware routing to
        # get right. 0.45 keeps headroom over peak in-flight KV so preemption
        # does not become the thing we are measuring.
        # NOTE: the sizing was derived against the retired 64-prefix s=1.2
        # workload; the frozen dataset is now 128 prefixes at s=0.9, so the
        # hot-set arithmetic no longer describes it. The value stands: kept
        # deliberately - re-derive before changing it, do not re-derive to
        # justify it.
        # Predicted pool at 0.45: ~99k tokens (29,123 tok/GiB). Validity rule 5
        # compares the engine log's "GPU KV cache size" against this.
        # Full derivation: issue #3.
        gpuMemoryUtilization: "0.45"

      serviceMonitor:
        enabled: true
        additionalLabels:
          app.kubernetes.io/part-of: vllm-stack

      lmcacheConfig:
        enabled: true
        cpuOffloadingBufferSize: "4"    # GB of CPU RAM for KV offload (node RAM is tight)
        enableController: true
        controllerPort: 9000
        controllerReplyPort: 9001
        workerPorts: "8001"
        p2pHost: "localhost"
        p2pInitPorts: "30081"
        workerHeartbeatTime: "30"
        logLevel: "INFO"

      # OpenShift runs containers with an arbitrary UID and HOME=/ (not writable):
      # flashinfer/vllm/triton try to mkdir ~/.cache at startup and crash.
      # Point HOME at /tmp (writable at any UID). Model weights still go to the
      # PVC via HF_HOME=/data (set by the chart).
      env:
        - name: HOME
          value: "/tmp"
        - name: XDG_CACHE_HOME
          value: "/tmp/.cache"

routerSpec:
  repository: "lmcache/lmstack-router"
  # Pinned to the newest router built while production-stack pinned
  # lmcache==0.3.9post2 (2025-11-14..2026-01-14 window, commit 37bafbcf) so the
  # controller protocol EXACTLY matches the v0.3.9post2 engines. ":latest"
  # carries lmcache 0.3.11 whose controller cannot decode 0.3.9post2 workers
  # (and no official engine image carries 0.3.11 - they leapfrog each other).
  tag: "0.1.9.dev9-g37bafbcf5.d20260107"
  resources:
    requests:
      cpu: "2"
      memory: "4G"
    limits:
      cpu: "2"
      memory: "4G"
  routingLogic: "kvaware"
  lmcacheControllerPort: 9000
  # NOTE: no lmcacheControllerReplyPort / HeartbeatPort - the 0.1.9-era router
  # predates those flags (single-socket controller on 9000; registration and
  # KV events all flow through the pull port, which the chart Service exposes).
  sessionKey: "x-user-id"
  engineScrapeInterval: 5

  # HF_HOME=/tmp/hf is set per cell by run_cell.sh, on BOTH arms (#21) -
  # KvawareRouter carries the identical try/except, so this is not an
  # arm-specific fix. It cannot live here (chart 0.1.11 has no routerSpec.env).

  # kvaware router init (LMCache controller + transformers imports) takes ~20s;
  # the default startup probe (5s delay, 3x5s failures) kills it mid-boot.
  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30    # up to ~160s to come up
    httpGet:
      path: /health
      port: router-port

  serviceMonitor:
    enabled: true
    additionalLabels:
      app.kubernetes.io/part-of: vllm-stack

# ---------------------------------------------------------------------------
# Observability: Prometheus + Grafana with the 3 shipped dashboards
# (vllm, lmcache, model metrics). Lean footprint - cluster memory is tight.
# ---------------------------------------------------------------------------
grafanaDashboards:
  enabled: true

kube-prometheus-stack:
  enabled: true
  defaultRules:
    create: false          # skip the k8s alert-rule zoo
  alertmanager:
    enabled: false
  nodeExporter:
    enabled: false
  kubeStateMetrics:
    enabled: false
  # The cluster has an OLDER prometheus-operator CRD (owned by the Run:AI install);
  # the subchart's Prometheus CR uses fields that CRD doesn't know
  # (.spec.enableOTLPReceiver) -> server-side apply fails. CRDs are cluster-scoped,
  # not ours to upgrade. So: no operator, no Prometheus CR - we run a plain
  # single-pod Prometheus instead (deploy/prometheus.yaml) and keep only Grafana
  # + the dashboard configmaps from this subchart.
  prometheusOperator:
    enabled: false
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
    tls:
      enabled: false
  prometheus:
    enabled: false
  grafana:
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            # the shipped vLLM/LMCache dashboards hardcode datasource uid
            # "prometheus" - without this pin Grafana assigns a random uid
            # and the dashboards show "datasource not found"
            uid: prometheus
            type: prometheus
            url: http://stack-prometheus:9090
            isDefault: true
    enabled: true
    adminPassword: cache-llm
    securityContext: null
    initChownData:
      enabled: false
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
      datasources:
        # subchart injects its own default datasource (pointing at the disabled
        # operator Prometheus) which collides with ours -> Grafana crashloops
        # with "Only one datasource per organization can be marked as default"
        defaultDatasourceEnabled: false
      securityContext: null
