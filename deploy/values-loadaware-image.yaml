# Overlay: run the router from OUR built image instead of the stock upstream one.
#
# The §6 reproducibility path: report numbers come from an image a reader can rebuild
# from the repo's Dockerfile. Built images only - the dev-loop overlay
# (deploy/dev/apply-router-patch.sh) is never measured; see benchmarks/README.md.
#
# Usage — layer it on top of the baseline values:
#
#   helm upgrade --install vllm vllm/vllm-stack -n cache-llm \
#     -f deploy/values-baseline-kvaware.yaml \
#     -f deploy/values-loadaware-image.yaml \
#     --set routerSpec.tag=<short-sha>
#
# The tag is the git short SHA the image was built from (see .github/workflows/
# router-image.yml). Never `latest`: the router and the engines must carry the same lmcache
# minor version, and a floating tag makes that impossible to audit after the fact. Cite the
# exact tag in the report alongside the numbers it produced.
#
# ⚠️ Switching the image restarts the router, which blinds the KV registry for ~40 s and
# poisons any prefix first stored in that window (issue #13). Gate the run:
#   ./deploy/dev/registry-probe.sh <unused-seed>

routerSpec:
  # Must match the QUAY_IMAGE repo variable used by the build workflow.
  repository: "quay.io/rhl193000/lmstack-router-loadaware"
  # tag: supplied per-deploy via --set routerSpec.tag=<short-sha>

  # β comes from the LOADAWARE_BETA env var (default 1.0). There is no α: the
  # argmax is invariant under positive scaling, so only the ratio was ever a
  # free parameter. β is dimensionless - the router normalizes load against the
  # live fleet mean - so 1.0 is a real default and not a per-cluster tuning.
  # Chart 0.1.11 IGNORES `routerSpec.env` (hardcoded env list in
  # deployment-router.yaml) - set it after the upgrade:
  #   oc set env deploy/stack-deployment-router LOADAWARE_BETA=1.0
  # benchmarks/run_cell.sh does this per sweep cell (and removes it on
  # baseline cells so a stale β cannot leak through the three-way merge).
  #
  # HF_HOME=/tmp/hf is set per cell by run_cell.sh, on BOTH arms (#21) - it
  # cannot live here (chart 0.1.11 has no routerSpec.env). See
  # benchmarks/README.md, "Cluster gotchas".
  routingLogic: "loadaware"
