name: Router image

# Builds the §6 deliverable image (stock pinned router + our patches/ overlay) and pushes
# it to Quay. Runs on CI rather than a laptop so the image is reproducible from the repo:
# no local container runtime, and the credential never leaves GitHub.
#
# Requires, set once by a repo admin:
#   secret QUAY_USERNAME  — a Quay ROBOT account (e.g. ns+cachellm), never a user password
#   secret QUAY_TOKEN     — that robot's token
#   variable QUAY_IMAGE   — e.g. quay.io/<namespace>/lmstack-router-loadaware
#
# Without them the build still runs and is verified on every push; only the push is skipped.

on:
  push:
    paths:
      - "patches/**"
      - "Dockerfile"
      - ".github/workflows/router-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The stock router image carries vllm + torch + xgrammar and unpacks to well over
      # 10 GB, which overruns a default runner's free space intermittently ("failed to
      # register layer: no space left on device"). Reclaim the preinstalled toolchains we
      # do not use before pulling.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Build
        run: docker build -t router-image:ci .

      - name: Verify the overlay actually landed
        # A silently-unpatched image would produce a "no improvement" result that looks
        # like a failed experiment rather than a failed build.
        # --entrypoint is required: the base image's entrypoint is `vllm-router`, so a bare
        # command is parsed as router arguments instead of being run.
        run: |
          docker run --rm --entrypoint grep router-image:ci -q "LOADAWARE PATCH" \
            /opt/venv/lib/python3.12/site-packages/lmcache/v1/cache_controller/controllers/kv_controller.py
          docker run --rm --entrypoint grep router-image:ci -q "LOADAWARE PATCH" \
            /opt/venv/lib/python3.12/site-packages/vllm_router/routers/routing_logic.py
          docker run --rm --entrypoint grep router-image:ci -q "LOADAWARE PATCH" \
            /opt/venv/lib/python3.12/site-packages/vllm_router/parsers/parser.py
          echo "patched lookup + loadaware router + CLI widening present in image"

      - name: Check push credentials
        id: creds
        run: |
          if [ -n "${{ secrets.QUAY_TOKEN }}" ] && [ -n "${{ vars.QUAY_IMAGE }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::QUAY_TOKEN / QUAY_IMAGE not configured — built and verified, not pushed."
          fi

      - name: Log in to Quay
        if: steps.creds.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Push
        if: steps.creds.outputs.ready == 'true'
        # Tagged by commit SHA, never `latest`: the router and engines must stay on the same
        # lmcache minor version, and a floating tag makes that impossible to audit after the
        # fact. The report cites the exact tag the numbers came from.
        run: |
          TAG="${{ vars.QUAY_IMAGE }}:$(git rev-parse --short HEAD)"
          docker tag router-image:ci "$TAG"
          docker push "$TAG"
          echo "::notice::pushed $TAG"
          echo "Deploy with: helm upgrade ... --set routerSpec.repository=${{ vars.QUAY_IMAGE }} --set routerSpec.tag=$(git rev-parse --short HEAD)"
