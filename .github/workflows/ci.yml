name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # --benchmark-disable still EXECUTES the benchmark bodies (so they remain real tests),
      # it just skips the timing loop - the suite stays fast.
      - run: pytest benchmarks/ tests/ -q --benchmark-disable

      # Reproducibility is 30% of the rubric and this is the script that carries the claim.
      # It reads only committed data - no cluster, no GPU, no network - so it belongs on
      # every push rather than in a human's pre-merge checklist, which is where it was.
      - name: reproduce.sh (every reported number regenerates from committed data)
        run: FIGS_OUT="$GITHUB_WORKSPACE/ci-figures" ./scripts/reproduce.sh

      # The figures reproduce.sh just rendered are otherwise deleted with its temp dir. Publish
      # them so a reviewer can look at a sweep's graphs from the run page without cloning the
      # branch. One subdirectory per sweep_id - these are REGENERATED from committed raw data,
      # so they are a rendering of what is in the repo, never a new measurement: CI has no
      # cluster and cannot run a sweep. `if: always()` so a drift failure still uploads the
      # figures, which is exactly when someone wants to see them.
      - name: Publish per-sweep figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures-by-sweep
          path: ci-figures/
          if-no-files-found: error

      # §3 Automation: the timed run. No pass/fail threshold on purpose - thresholds on shared
      # CI runners are flaky, get muted, and a muted check is worse than a number in the log
      # that a human can compare across commits.
      - name: Micro-benchmarks (router hot path)
        run: pytest tests/test_bench_routing.py --benchmark-only -q
          --benchmark-columns=min,mean,stddev,ops
